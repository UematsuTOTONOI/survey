<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>TOTONOIアンケートダッシュボード</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Noto+Serif+JP:wght@700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --theme:#6B4F2A;--accent:#A07840;--light:#F5EFE6;--bg:#FAF7F3;
  --surface:#fff;--text:#2C1F0E;--muted:#8C7355;--border:#DDD0BB;
  --green:#2D6A4F;--red:#C0392B;--blue:#1a6faa;
  --radius:14px;--shadow:0 2px 16px rgba(107,79,42,.09);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Zen Kaku Gothic New",sans-serif;background:var(--bg);color:var(--text);font-size:14px;}

/* Header */
header{background:var(--theme);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
header h1{font-family:"Noto Serif JP",serif;font-size:18px;font-weight:700;}
.header-sub{font-size:11px;opacity:.7;margin-top:2px;}
.header-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

/* Filter bar */
.filter-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.filter-bar label{font-size:12px;color:var(--muted);font-weight:500;}
.filter-bar select{border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px;background:var(--bg);cursor:pointer;}
.btn{background:var(--theme);color:#fff;border:none;border-radius:8px;padding:7px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:hover{opacity:.85;}
.btn.secondary{background:none;border:1px solid var(--border);color:var(--muted);}
#record-count{font-size:12px;color:var(--muted);margin-left:auto;}

/* Layout */
main{max-width:1280px;margin:0 auto;padding:20px 16px 40px;}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 14px;text-align:center;box-shadow:var(--shadow);}
.kpi .val{font-size:34px;font-weight:700;line-height:1;color:var(--theme);}
.kpi .val.green{color:var(--green);}
.kpi .val.blue{color:var(--blue);}
.kpi .val.red{color:var(--red);}
.kpi .lbl{font-size:11px;color:var(--muted);margin-top:5px;}
.kpi .sub{font-size:10px;color:var(--border);margin-top:2px;}

/* NPS */
.nps-bar-wrap{margin:10px 0 6px;height:10px;border-radius:5px;overflow:hidden;display:flex;}
.nps-seg{height:100%;transition:width .6s;}

/* Grid */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px;}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr;}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
.card h2{font-size:14px;font-weight:700;color:var(--theme);margin-bottom:14px;display:flex;align-items:center;gap:6px;}
.card.wide{grid-column:1/-1;}
.chart-wrap{position:relative;height:220px;}

/* Tab */
.tab-row{display:flex;gap:0;margin-bottom:14px;border-bottom:2px solid var(--border);}
.tab{padding:8px 16px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;font-family:inherit;}
.tab.active{color:var(--theme);border-bottom-color:var(--theme);font-weight:700;}

/* Comment list */
.comment-list{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow-y:auto;}
.comment-item{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
.comment-meta{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap;}
.score-badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;}
.score-high{background:#d4edda;color:#1a5c30;}
.score-mid{background:#fff3cd;color:#7a5c00;}
.score-low{background:#fde;color:#8b0000;}
.comment-date{font-size:11px;color:var(--muted);}
.comment-text{font-size:13px;line-height:1.7;color:var(--text);}
.empty-msg{text-align:center;padding:40px;color:var(--muted);font-size:13px;}

/* Month table */
.month-table{width:100%;border-collapse:collapse;font-size:12px;}
.month-table th{background:var(--theme);color:#fff;padding:7px 10px;text-align:center;font-weight:500;}
.month-table td{padding:7px 10px;border-bottom:1px solid var(--border);text-align:center;}
.month-table tr:nth-child(even) td{background:var(--light);}
.month-table .left{text-align:left;}

/* Score bar */
.score-bar-wrap{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.score-bar-lbl{font-size:12px;color:var(--muted);width:60px;flex-shrink:0;}
.score-bar-bg{flex:1;height:10px;background:var(--border);border-radius:5px;overflow:hidden;}
.score-bar-fill{height:100%;border-radius:5px;transition:width .5s;background:var(--green);}
.score-bar-val{font-size:12px;font-weight:700;color:var(--theme);width:28px;text-align:right;}

/* Stat row */
.stat-row{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted);margin-top:6px;}

/* Chatwork GAS */
.code-block{background:#1e1e1e;color:#d4d4d4;border-radius:10px;padding:16px;font-family:monospace;font-size:12px;overflow-x:auto;margin-top:10px;line-height:1.6;}
</style>
</head>
<body>

<header>
  <div>
    <h1>🏕️ TOTONOIアンケートダッシュボード</h1>
    <div class="header-sub">Glamping Village Fujiyamanakako — 過去データ + 新規回答</div>
  </div>
  <div class="header-right">
    <span id="last-updated" style="font-size:11px;opacity:.7;"></span>
  </div>
</header>

<div class="filter-bar">
  <label>期間</label>
  <select id="filter-period">
    <option value="all">全期間</option>
    <option value="2025">2025年</option>
    <option value="2026">2026年</option>
  </select>
  <label>月</label>
  <select id="filter-month"><option value="all">すべて</option></select>
  <button class="btn" onclick="applyFilter()">絞り込み</button>
  <button class="btn secondary" onclick="resetFilter()">リセット</button>
  <span id="record-count"></span>
</div>

<main>
  <!-- KPI -->
  <div class="kpi-row" id="kpi-row"></div>

  <!-- NPS -->
  <div class="card" style="margin-bottom:16px;" id="nps-card">
    <h2>📊 NPS（ネット・プロモーター・スコア）</h2>
    <div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap;">
      <div style="text-align:center;">
        <div id="nps-val" style="font-size:48px;font-weight:700;color:var(--theme);line-height:1;"></div>
        <div style="font-size:11px;color:var(--muted);margin-top:4px;">NPS スコア</div>
      </div>
      <div style="flex:1;min-width:200px;">
        <div class="nps-bar-wrap" id="nps-bar"></div>
        <div style="display:flex;justify-content:space-between;font-size:11px;margin-top:4px;">
          <span style="color:var(--red);">😞 批判者（1-6）<span id="nps-d"></span>名</span>
          <span style="color:var(--muted);">😐 中立（7-8）<span id="nps-n"></span>名</span>
          <span style="color:var(--green);">😊 推奨者（9-10）<span id="nps-p"></span>名</span>
        </div>
        <div style="font-size:12px;color:var(--muted);margin-top:10px;line-height:1.7;">
          NPS = 推奨者% − 批判者%｜-100〜+100の範囲｜<span style="color:var(--green);font-weight:700;">50以上は「優秀」</span>
        </div>
      </div>
    </div>
  </div>

  <!-- スコア平均 + 月別推移 -->
  <div class="grid2">
    <div class="card">
      <h2>⭐ 項目別平均スコア</h2>
      <div id="score-bars"></div>
    </div>
    <div class="card">
      <h2>📈 月別・施設全体スコア推移</h2>
      <div class="chart-wrap"><canvas id="ch-trend"></canvas></div>
    </div>
  </div>

  <!-- 年代 + 再利用 + スコア分布 -->
  <div class="grid3">
    <div class="card">
      <h2>👥 年代分布</h2>
      <div class="chart-wrap"><canvas id="ch-age"></canvas></div>
    </div>
    <div class="card">
      <h2>🔄 再利用意向</h2>
      <div class="chart-wrap"><canvas id="ch-revisit"></canvas></div>
    </div>
    <div class="card">
      <h2>📊 施設全体スコア分布</h2>
      <div class="chart-wrap"><canvas id="ch-dist"></canvas></div>
    </div>
  </div>

  <!-- コメント一覧（スコア別タブ） -->
  <div class="card wide" style="margin-bottom:16px;">
    <h2>💬 お客様コメント一覧</h2>
    <div class="tab-row">
      <button class="tab active" onclick="showCommentTab('all',this)">すべて</button>
      <button class="tab" onclick="showCommentTab('high',this)">😊 8〜10点</button>
      <button class="tab" onclick="showCommentTab('mid',this)">😐 5〜7点</button>
      <button class="tab" onclick="showCommentTab('low',this)">😞 4点以下</button>
    </div>
    <div id="comment-list" class="comment-list"></div>
  </div>

  <!-- 月別サマリーテーブル -->
  <div class="card wide">
    <h2>📅 月別サマリー</h2>
    <div style="overflow-x:auto;">
      <table class="month-table" id="month-table">
        <thead><tr>
          <th>月</th><th>件数</th><th>施設全体</th><th>スタッフ</th>
          <th>清潔度</th><th>サウナ</th><th>夕食</th><th>朝食</th><th>焚き火</th><th>再利用%</th>
        </tr></thead>
        <tbody id="month-tbody"></tbody>
      </table>
    </div>
  </div>
</main>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbyO2JNAwh5q058MBcRUHejOMkmNKlPojLG0eVIoox_3SVoLtHAJs-Nb4t7aRim_FHtZ/exec"; // ← GASのデプロイURLに書き換え
const STATIC_DATA = [{"date": "2025/05/02", "month": "2025-05", "age": null, "overall": 8, "staff": 10, "clean": 10, "sauna": 10, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": "とても素敵な時間を過ごせました。ありがとうございました。"}, {"date": "2025/05/02", "month": "2025-05", "age": null, "overall": 8, "staff": 9, "clean": 8, "sauna": 7, "dinner": 10, "breakfast": null, "bonfire": 10, "revisit": "はい", "comment": ""}, {"date": "2025/05/03", "month": "2025-05", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": null, "dinner": 10, "breakfast": 10, "bonfire": 10, "revisit": "はい", "comment": ""}, {"date": "2025/05/04", "month": "2025-05", "age": null, "overall": 9, "staff": 10, "clean": 10, "sauna": null, "dinner": 9, "breakfast": 9, "bonfire": null, "revisit": "はい", "comment": "朝食がスムージーじゃなくなっていて残念でした。スープが欲しかったです。"}, {"date": "2025/05/04", "month": "2025-05", "age": null, "overall": 8, "staff": 9, "clean": 7, "sauna": null, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": "景色とスペース　最高でした。\nテレビがあったら早く着いても時間がつぶせたかな〜と思いました。"}, {"date": "2025/05/04", "month": "2025-05", "age": null, "overall": 9, "staff": 7, "clean": 9, "sauna": 10, "dinner": 10, "breakfast": null, "bonfire": 9, "revisit": "はい", "comment": "女性スタッフがいるとより良いと思いました。\nとても楽しく過ごせました、またよろしくお願いします。"}, {"date": "2025/05/05", "month": "2025-05", "age": null, "overall": 8, "staff": 8, "clean": 8, "sauna": 8, "dinner": 8, "breakfast": 7, "bonfire": null, "revisit": "はい", "comment": ""}, {"date": "2025/05/06", "month": "2025-05", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": 10, "breakfast": null, "bonfire": 10, "revisit": "はい", "comment": "楽しかったです！"}, {"date": "2025/05/06", "month": "2025-05", "age": null, "overall": 7, "staff": 8, "clean": 7, "sauna": null, "dinner": 7, "breakfast": 4, "bonfire": null, "revisit": "わからない", "comment": "ドーム内の匂いが気になった。化学繊維の匂い？夕食は満足いく内容だったが、朝食が少し物足りなかった。土地柄寒いので、シャワーだけでなく、浴室があると良かった。あとは可もなく不可もなく。"}, {"date": "2025/05/06", "month": "2025-05", "age": null, "overall": 8, "staff": 9, "clean": 9, "sauna": 10, "dinner": 8, "breakfast": 7, "bonfire": 7, "revisit": "はい", "comment": "スタッフさんの対応やサウナ、ご飯のおいしさなど全体的にとても満足度が高かったです。\n以下改善があるとより良いなと思いました。\n•夕食時のスープをよそう器が、もう少し耐熱性に優れたものであるといい\n•馬刺し醤油を用意してほしい\n•紙コップの数を増やす、もしくはマグカップなど耐熱性のあるコップを用意してほしい"}, {"date": "2025/05/06", "month": "2025-05", "age": null, "overall": 9, "staff": 10, "clean": 10, "sauna": null, "dinner": 10, "breakfast": 9, "bonfire": null, "revisit": "はい", "comment": "朝ごはんのスクランブルエッグとベーコンは、ヨーグルトと別で温められる容器に入れていただけると嬉しいです！"}, {"date": "2025/05/06", "month": "2025-05", "age": null, "overall": 10, "staff": 10, "clean": 9, "sauna": null, "dinner": null, "breakfast": null, "bonfire": 10, "revisit": "はい", "comment": "・スタッフの方の接客が丁寧だった\n・室内の食事スペースの机がちょっとベタついていたのが気になった"}, {"date": "2025/05/07", "month": "2025-05", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": null, "breakfast": null, "bonfire": 7, "revisit": "はい", "comment": ""}, {"date": "2025/05/08", "month": "2025-05", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": "今までで行った所で1番良かったです！近くにコンビニも温泉もあって楽しい2日間を過ごせました☺️✨"}, {"date": "2025/05/12", "month": "2025-05", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": null, "dinner": null, "breakfast": 10, "bonfire": null, "revisit": "はい", "comment": ""}, {"date": "2025/05/13", "month": "2025-05", "age": null, "overall": 9, "staff": 10, "clean": 10, "sauna": 9, "dinner": 10, "breakfast": 8, "bonfire": 8, "revisit": "はい", "comment": ""}, {"date": "2025/05/16", "month": "2025-05", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": null, "breakfast": null, "bonfire": 10, "revisit": "はい", "comment": "サプライズでケーキとお花ありがとうございました。忘れない思い出ができました。"}, {"date": "2025/05/17", "month": "2025-05", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": 10, "breakfast": 8, "bonfire": 10, "revisit": "はい", "comment": "17:30からのサウナの予定だったが前の予約がなかったようで30分早めてサウナに案内してくださりました。サウナを楽しみにしていたのでとても嬉しかったです！！"}, {"date": "2025/05/18", "month": "2025-05", "age": null, "overall": 9, "staff": 10, "clean": 10, "sauna": 8, "dinner": 10, "breakfast": 8, "bonfire": 8, "revisit": "はい", "comment": "この度はありがとうございました。全体的に満足いくわんことの旅となりました。\nただ、いくつか改善していただけるとありがたい点もあり、いくつか挙げさせてもらいます。\n・（サウナ）　イグルーサウナに関しては取手部分が破損しておりドアの開閉がとても女性ではロックしにくかったです。また、脱衣所はハンガーやカゴがあった方が複数人で利用する際にはありがたいです。ただ、全体的にサウナは高温になり、かつ開放的で総合的に本格的でとてもよかったのでまた利用したいと思いました\n\n・（部屋）犬用の足拭きタオルがあるとありがたいです。また、エアコン横壁の配線モールがずれているのが気になった。\n\n・（浴室）広くて清潔でよかったです。バスソルトや入浴剤があるとなお良いと思います。\n・（洗面所）タオルハンガーがあると良い。もしくは手を拭くペーパーがあると良いです。\n・（キッチン）網戸の建て付けがあまり良くない感じでした。\n・（庭・ドッグラン）犬用の足洗い場があるとなお良い\n・（食事）どれくらい焼くかなどガイド的な紙があると良いと思いました。全体的に量も多くサラダも美味しかったです。I Hで温められるも良いですね\n・（全体）\nGoogleの口コミを見る限り少し期待値が低くなっていたのですが、口コミにあった指摘を都度改善し続けているのが垣間見れ、事前の不安は杞憂に終わりました（馬刺しが新鮮でないなど）。きちんと顧客の声に耳を傾けている姿勢を応援します。またこれからも期待しています。"}, {"date": "2025/05/18", "month": "2025-05", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": "スタッフの皆さんのサービスで\n翌日の予定を伺ったこのも丁寧に教えていただき\n焚き火の焼きマシュマロでも素敵な写真を沢山\n撮っていただきました。\nサウナ好きな若者達も大満足の\nサウナだったようです。\n雨漏りについては\n直ぐに丁寧な対応をしていただき\n充実過ぎるフォローをしていただきました。\n\nロケーションも素晴らしく\n充実した綺麗な施設で、また是非\n利用したいとおもいました。\n母の誕生日のプレゼントで家族旅行にしましたがとてもとても良い思い出になりました。\nありがとうございました。"}, {"date": "2025/05/19", "month": "2025-05", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": null, "dinner": null, "breakfast": null, "bonfire": 10, "revisit": "はい", "comment": ""}, {"date": "2025/05/19", "month": "2025-05", "age": null, "overall": 8, "staff": 8, "clean": 10, "sauna": 10, "dinner": 7, "breakfast": 7, "bonfire": 10, "revisit": "はい", "comment": "朝食のスクランブルエッグが冷たかった\nスープの人参が少し固かった\n味は夕食も朝食も美味しかったです！！\n馬刺しがてんこ盛りで嬉しかったです！\nニンニクがついてて尚良かったです！\nドレッシングが美味しかったです！\nサウナの時間が90分から120分コースもあれば嬉しいです！\n白米やおにぎりがあると嬉しいです！"}, {"date": "2025/05/20", "month": "2025-05", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": null, "dinner": 10, "breakfast": 6, "bonfire": 10, "revisit": "はい", "comment": ""}, {"date": "2025/05/22", "month": "2025-05", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": 10, "breakfast": 10, "bonfire": 10, "revisit": "はい", "comment": ""}, {"date": "2025/05/25", "month": "2025-05", "age": null, "overall": 9, "staff": 10, "clean": 10, "sauna": null, "dinner": 9, "breakfast": 7, "bonfire": 10, "revisit": "はい", "comment": "娘（4歳）が女性スタッフさんととても仲良くなって、あんなに社交的な子の姿をはじめてみたのでとてもよかったです。仲良く遊んでくれて本当にありがとうございました。娘がまた行きたいと強く言ってました。今度はサウナも利用したり焚き火ももっと長くやれればと思いました。"}, {"date": "2025/05/25", "month": "2025-05", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": 10, "breakfast": 10, "bonfire": 10, "revisit": "はい", "comment": ""}, {"date": "2025/05/26", "month": "2025-05", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": null, "dinner": 8, "breakfast": 6, "bonfire": 10, "revisit": "はい", "comment": "とても快適に過ごせました。ありがとうございました。"}, {"date": "2025/05/27", "month": "2025-05", "age": null, "overall": 8, "staff": 10, "clean": 10, "sauna": null, "dinner": null, "breakfast": null, "bonfire": 8, "revisit": "はい", "comment": ""}, {"date": "2025/05/27", "month": "2025-05", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": null, "breakfast": null, "bonfire": 10, "revisit": "はい", "comment": "サービスがとっても充実しているなって思いました！また行かせていただきたいと思います！\nありがとうございます😸"}, {"date": "2025/05/28", "month": "2025-05", "age": null, "overall": 9, "staff": 10, "clean": 10, "sauna": null, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": ""}, {"date": "2025/05/28", "month": "2025-05", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": null, "breakfast": null, "bonfire": 10, "revisit": "はい", "comment": "普段キャンプをすることが多いので、ロケーションはもちろん、設備が充実していて大満足です。焚き火をもう少しゆっくりできたら良かったです。是非また伺いたいと思います。"}, {"date": "2025/05/30", "month": "2025-05", "age": null, "overall": 9, "staff": 9, "clean": 8, "sauna": null, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": "バーベキューグリルが少し汚かった"}, {"date": "2025/06/01", "month": "2025-06", "age": null, "overall": 10, "staff": 10, "clean": 7, "sauna": 10, "dinner": 10, "breakfast": 10, "bonfire": null, "revisit": "はい", "comment": ""}, {"date": "2025/06/01", "month": "2025-06", "age": null, "overall": 8, "staff": 9, "clean": 8, "sauna": 8, "dinner": 8, "breakfast": 8, "bonfire": 7, "revisit": "はい", "comment": "着火バーナーのオイルが少なく付きが悪かったです。スムーズに点火されるか毎日点検をおすすめします。"}, {"date": "2025/06/01", "month": "2025-06", "age": null, "overall": 10, "staff": 10, "clean": 8, "sauna": null, "dinner": null, "breakfast": null, "bonfire": 8, "revisit": "はい", "comment": "とても快適に過ごせました。また機会があれば是非お願いいたします。"}, {"date": "2025/06/07", "month": "2025-06", "age": null, "overall": 10, "staff": 10, "clean": 8, "sauna": 10, "dinner": 10, "breakfast": 8, "bonfire": 10, "revisit": "はい", "comment": "自然に触れゆっくりとした時間が過ごせました。ありがとうございました。"}, {"date": "2025/06/07", "month": "2025-06", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": null, "breakfast": null, "bonfire": 10, "revisit": "はい", "comment": "施設が綺麗で気持ちよく使えました。\n受付の方やマシュマロの方も親切で良かったです。ありがとうございました。"}, {"date": "2025/06/08", "month": "2025-06", "age": null, "overall": 8, "staff": 10, "clean": 8, "sauna": 10, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": "ガスライターが何かわからず、火をつけてしまい火傷しそうになったため、表示等あれば安全に使用できると感じました。"}, {"date": "2025/06/09", "month": "2025-06", "age": null, "overall": 10, "staff": 9, "clean": 10, "sauna": 10, "dinner": 9, "breakfast": 10, "bonfire": 10, "revisit": "はい", "comment": "とても丁寧な接客、わかりやすい説明でLINEのやりとりも有り難かったです！\n大自然を楽しむことができました。\nキッチンに入った時のちょっとした臭いが気になりました！\nけど全体的に満足で、また機会があれば来たいと思います。ありがとうございました！"}, {"date": "2025/06/09", "month": "2025-06", "age": null, "overall": 3, "staff": 5, "clean": 3, "sauna": 8, "dinner": null, "breakfast": null, "bonfire": 2, "revisit": "はい", "comment": "アメニティや用意されている備品・調味料の内容をもっと具体的にホームページに記載して欲しい。\nウェルカムサービスを朝も設置して欲しい。もしくはもう少し内容を充実させて欲しい。\nフライパンの蓋も用意しておいて欲しい。\nコーヒーフレッシュなどが入っているケース内にゴミが入っていた。\nサウナにウォーターサーバー等を設置し、無料で水分補給できるようにして欲しい。\nバスタオルを床に置くのは不衛生だと思う。また、前の方のバーベキューの残り香だと思われる匂いがタオルに付いていて不快であった。"}, {"date": "2025/06/12", "month": "2025-06", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": 10, "breakfast": 10, "bonfire": null, "revisit": "はい", "comment": "ありがとうございました！"}, {"date": "2025/06/14", "month": "2025-06", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": null, "breakfast": null, "bonfire": 10, "revisit": "はい", "comment": ""}, {"date": "2025/06/15", "month": "2025-06", "age": null, "overall": 7, "staff": 10, "clean": 9, "sauna": 5, "dinner": null, "breakfast": null, "bonfire": 7, "revisit": "わからない", "comment": "雨の影響もあったが、ととのいスペースの足場がぐちゅぐちゅで気持ち悪かった。\n化粧砂利などで水捌けよかったらなあと思った。\nスタッフの人当たりはすごくよかった。"}, {"date": "2025/06/15", "month": "2025-06", "age": null, "overall": 10, "staff": 7, "clean": 10, "sauna": 10, "dinner": 10, "breakfast": 10, "bonfire": 10, "revisit": "はい", "comment": ""}, {"date": "2025/06/15", "month": "2025-06", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": null, "dinner": null, "breakfast": null, "bonfire": 10, "revisit": "はい", "comment": "スタッフさんの対応含め、施設全体に魅力を感じました。必ずリピートさせていただきます‼︎"}, {"date": "2025/06/16", "month": "2025-06", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": "最高でした。"}, {"date": "2025/06/17", "month": "2025-06", "age": null, "overall": 9, "staff": 10, "clean": 9, "sauna": 9, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": "家庭の事情がありチェックインが遅くなってしまいましたが、コンロを使用できる時間を少し伸ばしていただけました。\nサウナもギリギリ利用できましたが、朝も使えたらいいなぁと思いました。\nコンロも使用時間制限ないといいなぁと思います。"}, {"date": "2025/06/23", "month": "2025-06", "age": null, "overall": 8, "staff": 7, "clean": 7, "sauna": 8, "dinner": null, "breakfast": null, "bonfire": 6, "revisit": "はい", "comment": "もう少し遅くまで焚き火等できるといいです。"}, {"date": "2025/06/23", "month": "2025-06", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": ""}, {"date": "2025/06/24", "month": "2025-06", "age": null, "overall": 8, "staff": 10, "clean": 10, "sauna": 8, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": "虫がすごかった点以外は満足でした。別棟に網戸なども準備いただけるといいなと思いました。サウナの水風呂のデザインをもう少し工夫して欲しいなと思いました。"}, {"date": "2025/06/25", "month": "2025-06", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": 10, "breakfast": 10, "bonfire": null, "revisit": "はい", "comment": "ご飯美味しくて、よかったです！雨だったので富士山が見えなかったのが残念でしたが初めてのグランピングとても楽しかったです！"}, {"date": "2025/06/26", "month": "2025-06", "age": null, "overall": 9, "staff": 10, "clean": 9, "sauna": 10, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": ""}, {"date": "2025/06/29", "month": "2025-06", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": 10, "breakfast": 10, "bonfire": null, "revisit": "はい", "comment": ""}, {"date": "2025/06/29", "month": "2025-06", "age": null, "overall": 7, "staff": 10, "clean": 9, "sauna": 10, "dinner": 9, "breakfast": 10, "bonfire": null, "revisit": "はい", "comment": "ドームテントの小さい方の窓にもカーテンが欲しかった。朝明るすぎて…"}, {"date": "2025/07/04", "month": "2025-07", "age": null, "overall": 9, "staff": 9, "clean": 9, "sauna": null, "dinner": 10, "breakfast": 10, "bonfire": null, "revisit": "はい", "comment": "天気も良くゆったりとした時間をすごすことができました。スタッフの方々も気さくに話していただけて楽しかったです。\n個人的には焚き火と朝食が気に入りました。\n強いてあげるなら、お部屋に鏡や化粧台があると大変ありがたいです。\nありがとうございました。"}, {"date": "2025/07/05", "month": "2025-07", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": 10, "breakfast": 10, "bonfire": null, "revisit": "はい", "comment": ""}, {"date": "2025/07/06", "month": "2025-07", "age": null, "overall": 9, "staff": 10, "clean": 10, "sauna": 10, "dinner": 10, "breakfast": 10, "bonfire": 10, "revisit": "はい", "comment": "焚き火をいつでも出来るようにしてほしいです。\nサウナと焚き火の可能な時間が被ってしまい、できなかったからです。"}, {"date": "2025/07/09", "month": "2025-07", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": null, "dinner": 9, "breakfast": 10, "bonfire": 10, "revisit": "はい", "comment": "お部屋もキレイで、食事するところも清潔でした。部屋のソファの脚が壊れていたので、確認してください。チェックインした時に部屋が暑かったので、涼しくしていただけたらもっと快適かな？と思ったのと、夜の部屋のカギが真っ暗でわかりにくかったので、センサーライトなどあると助かるかもしれません。\n焚き火の時間が10時までだとご近所迷惑などがあるのでしょうか？大人はそのくらいまでできたらいいかもです。\nロケーションも最高でしたし、野生の鹿が遊びに？来てくれてたりと、本当に素敵な1日を過ごせました。\n今度は寒い時期に、星空を見たいと思います。"}, {"date": "2025/07/09", "month": "2025-07", "age": null, "overall": 8, "staff": 7, "clean": 8, "sauna": 7, "dinner": 7, "breakfast": 6, "bonfire": null, "revisit": "はい", "comment": ""}, {"date": "2025/07/12", "month": "2025-07", "age": null, "overall": 2, "staff": 2, "clean": 6, "sauna": 3, "dinner": null, "breakfast": null, "bonfire": 1, "revisit": "いいえ", "comment": ""}, {"date": "2025/07/12", "month": "2025-07", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": null, "breakfast": 10, "bonfire": null, "revisit": "はい", "comment": ""}, {"date": "2025/07/13", "month": "2025-07", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": null, "dinner": null, "breakfast": null, "bonfire": 10, "revisit": "はい", "comment": "ウエルカムボードに犬の名前を書いてくれて、お兄さんも犬の名前覚えていてくれた事がとても嬉しかったです。\n焚き火のおやつも楽しめました。\n大満足です。\nありがとうございました。"}, {"date": "2025/07/13", "month": "2025-07", "age": null, "overall": 8, "staff": 10, "clean": 8, "sauna": 7, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": ""}, {"date": "2025/07/14", "month": "2025-07", "age": null, "overall": 8, "staff": 7, "clean": 6, "sauna": null, "dinner": 7, "breakfast": 6, "bonfire": 5, "revisit": "わからない", "comment": "利用する前から、部屋がBBQの匂いがした。\n消臭が出来ているともっといいです。"}, {"date": "2025/07/15", "month": "2025-07", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 9, "dinner": 9, "breakfast": 8, "bonfire": 10, "revisit": "はい", "comment": "生憎の天候でしたが、スタッフ様の心遣いが大変嬉しく、とても楽しい時間を過ごさせていただきました。素晴らしかったです。また行きたいです。"}, {"date": "2025/07/19", "month": "2025-07", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": null, "breakfast": null, "bonfire": 7, "revisit": "はい", "comment": ""}, {"date": "2025/07/19", "month": "2025-07", "age": null, "overall": 9, "staff": 10, "clean": 10, "sauna": 10, "dinner": 10, "breakfast": 10, "bonfire": 10, "revisit": "はい", "comment": "トイレのウォシュレットが動かなかったのと、ヘアードライヤーのキャップが外れ易かった事と、網戸の建付けが悪かった事以外は完璧だったと思います。ありがとうございました。"}, {"date": "2025/07/20", "month": "2025-07", "age": null, "overall": 10, "staff": 10, "clean": 9, "sauna": 10, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": ""}, {"date": "2025/07/20", "month": "2025-07", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": "接客が丁寧でよかったです"}, {"date": "2025/07/20", "month": "2025-07", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": 8, "breakfast": null, "bonfire": 10, "revisit": "はい", "comment": "全体的にとても良いサービスとお宿でした。\nスタッフの方々も気さくに話しかけていただき、楽しく過ごすことができました。\n食事も大変美味しかったのですが、1点だけ、ポトフは塩味が強かったので、もう少し薄くしていただけるとより食べやすいと思いました。"}, {"date": "2025/07/21", "month": "2025-07", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": null, "dinner": 9, "breakfast": 10, "bonfire": null, "revisit": "はい", "comment": ""}, {"date": "2025/07/21", "month": "2025-07", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 9, "dinner": null, "breakfast": null, "bonfire": 5, "revisit": "はい", "comment": "・サウナ\nアツアツの薪サウナ最高でした。水風呂も天然水？で水温もちょうど良かったです。\n強いて言うなら外気浴で座ってしまうと富士山が見えなくなってしまうのが残念でした。\nあとは庭にテントサウナと水風呂を設置して、いつでもサウナを楽しめるプランがあれば嬉しいです。\n\n・BBQ\nBBQ用ガスコンロが室内でしか使えなかったので、庭でも使えたら良かったと少し思いました。フライパンの他に鍋とボウル、ザルなども欲しかったです。\n\n・部屋\n清潔感があって快適に過ごせました。\n富士山が一望できるのも最高ですね。\n\n総じてとても楽しく充実した時間を過ごすことができました。\nまたいつか行きたいと思います。\nこれからもより良い施設になるように頑張ってください！"}, {"date": "2025/07/25", "month": "2025-07", "age": null, "overall": 8, "staff": 7, "clean": 9, "sauna": 6, "dinner": 9, "breakfast": 9, "bonfire": 4, "revisit": "わからない", "comment": ""}, {"date": "2025/07/25", "month": "2025-07", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": null, "dinner": null, "breakfast": null, "bonfire": 10, "revisit": "はい", "comment": ""}, {"date": "2025/07/25", "month": "2025-07", "age": null, "overall": 7, "staff": 8, "clean": 7, "sauna": null, "dinner": 7, "breakfast": 7, "bonfire": null, "revisit": "わからない", "comment": ""}, {"date": "2025/07/27", "month": "2025-07", "age": null, "overall": 7, "staff": 7, "clean": 7, "sauna": null, "dinner": 7, "breakfast": 5, "bonfire": 8, "revisit": "はい", "comment": "ドッグラン付きで犬と一緒に過ごせることがこんなに楽しいんだと知れた旅になりました。\n犬の排泄物を入れる黒い袋が補充されておらず空の箱が入っていたり、ペットシートもサイズが違ったり、残念だなと感じる点は何点かありました。\nあと、お料理は口頭での説明に加えて、コンロの手順やお肉の焼き方などを記載したものを準備していただけたらより楽しめたと思います。\n焚き火やコンロの使用が21:30までなのは少し早いように感じました。今回サウナを利用しませんでしたが、使っていたら慌ただしかっただろうなと。この時間の変更が難しいならば、お夕飯の時間をもっと早く案内すべきと思います。\n初のグランピングでしたが、トータルで大満足です。"}, {"date": "2025/07/27", "month": "2025-07", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": null, "breakfast": null, "bonfire": 10, "revisit": "はい", "comment": ""}, {"date": "2025/07/27", "month": "2025-07", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 7, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": "目の前に富士山が見え部屋もとても綺麗で素敵でした\nスタッフの人達もやさしく対応してくれました\nサウナは少し暑すぎましたがいい経験ができました\n今度は冬に行ってみたいです\nありがとうございました"}, {"date": "2025/07/28", "month": "2025-07", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": null, "dinner": 8, "breakfast": 8, "bonfire": 7, "revisit": "はい", "comment": "母の古希のお祝いで、女子4人で利用させていただきました。\nテント内にシャワーとトイレがある所をさがしていて、こちらを利用させていただきました。\n想像以上にお部屋も綺麗で、バーベキューも別部屋になっていて、臭いを気にせず楽しめました。外での焚き火や花火なども楽しめて最高でした！！！\n\nただ、シャンプーだけが残念でした...。\n髪の長い女子には、あいませんでした。。\nドライヤー後も、翌日もずっとギシギシで。。\n\nそれだけが残念でしたが、また機会があれば利用したいなと思えるほど大満足でした。\n\nありがとうございました。"}, {"date": "2025/07/29", "month": "2025-07", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": null, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": ""}, {"date": "2025/08/01", "month": "2025-08", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": 10, "breakfast": 10, "bonfire": null, "revisit": "はい", "comment": "とても良い休日になりました。\nありがとうございました！"}, {"date": "2025/08/03", "month": "2025-08", "age": null, "overall": 8, "staff": 8, "clean": 10, "sauna": 8, "dinner": 8, "breakfast": 9, "bonfire": 4, "revisit": "はい", "comment": "カーナビでたどり着けず、だいぶ道に迷いました。セブン−イレブンで左折とか、情報が欲しかったです。\n夕食時、煙が充満して少し気持ち悪くなりました。まど開けたら蛾が入ってくるし。換気扇の横の窓が網戸になってるのは、朝になって気づきました。\nお肉、柔らかくて美味しかったけど、最後の方苦しかったかな。わさびかレモンが欲しかった。\nでも、基本的には大満足です。\nニジマス美味しかった！"}, {"date": "2025/08/05", "month": "2025-08", "age": null, "overall": 5, "staff": 10, "clean": 10, "sauna": null, "dinner": 5, "breakfast": 5, "bonfire": null, "revisit": "いいえ", "comment": "スタッフ対応はとても良かった。　施設内の雑草は狩った方がいい、駐車場や施設内道を舗装にして欲しい、部屋にテレビ"}, {"date": "2025/08/07", "month": "2025-08", "age": null, "overall": 5, "staff": 9, "clean": 6, "sauna": null, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "いいえ", "comment": "良かった点\n・富士山が望める場所で宿泊ができたこと\n・価格が手頃であること\n・施設の設備が使いやすく、備品も十分だったこと\n・夜の焚き火などの非日常な空間で過ごすことができたこと\n・子供達が楽しめる十分なスペースがプライベートスペースにも共有スペースにもあったこと\n・シャワールーム、洗面、台所がとても綺麗で衛生的だったこと\n・ゴミの分別がきちんとできること\n・スタッフが親切丁寧な日本人であったこと\n・布団が清潔\n\n改善してほしい点\n・まな板が変色や傷、ぬめりでやや不衛生。\n・床は埃こそ少ないものの拭くと真っ黒になる。庭と繋がっていたりするので仕方ない？にしてもかなり汚れていた。\n・受付がごちゃついている。\n・周りが遠征などで部活の声が聞こえて残念すぎた。先に教えて欲しかった。\n・プライベートガーデンの草が手入れされていなさすぎる\n\n\n要望\n・寝巻きの貸し出しがあると嬉しい\n・夏はプールの貸し出しがあると嬉しい\n・周りの部活が見えない囲いは欲しい。施設内で過ごしていても視線が気になるし、ずっと残念な気持ちになる。"}, {"date": "2025/08/07", "month": "2025-08", "age": null, "overall": 5, "staff": 8, "clean": 8, "sauna": null, "dinner": null, "breakfast": null, "bonfire": 5, "revisit": "わからない", "comment": "サイト内に落葉樹などを植えて日陰があれば良いと思う。または、デッキ上にタープか屋根を設置してほしい。\nドームテントは、夏場はビニールハウス効果で冷房も効かないほど暑くなってしまうので、連泊して観光にも出かけず場内でのんびり過ごしたかったが、日陰すらないと人も、犬もただ辛いだけだった。\nウェルカムドリンクは、甘いレモンティー１種類ならサービスはしなくても良いと思った。\n同価格同程度のドッグラン付きグランピングで、他の所ではウェルカムドリンクの種類が豊富であったり他にもアルコールサービスなど豊富だったりするので、比べてしまいました。\n\n夏場は近隣の合宿所から、宴会の声が夜中まで続くので夏に利用した者は、また来たいとは思えないかなと感じます。"}, {"date": "2025/08/08", "month": "2025-08", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": 10, "breakfast": 10, "bonfire": null, "revisit": "はい", "comment": "全体的にとても満足でした。\n犬飼いとしての要望は、玄関からの飛び出し防止に、ベビーゲート（ペットゲート）の設置をしていただけると、玄関での対応がスムーズでより良いかなと思います。"}, {"date": "2025/08/08", "month": "2025-08", "age": null, "overall": 6, "staff": 8, "clean": 4, "sauna": null, "dinner": 5, "breakfast": 6, "bonfire": null, "revisit": "わからない", "comment": "ペット禁止の部屋を予約したが、入室した途端ペット臭なのか汗臭いのか匂いが鼻についた。\n食事スペースは油のベタつきが酷く匂いもきつかった。\nコンロは室外に置いた方が良いと思います。\n朝はグラウンドの整備の音がうるさく目が覚めた。\n食事についてはコストパフォーマンス的に満足いくものではなかった。\nもう少し演出があっても良いかもしれません。"}, {"date": "2025/08/09", "month": "2025-08", "age": null, "overall": 7, "staff": 8, "clean": 10, "sauna": null, "dinner": null, "breakfast": 7, "bonfire": null, "revisit": "わからない", "comment": ""}, {"date": "2025/08/11", "month": "2025-08", "age": null, "overall": 4, "staff": 5, "clean": 3, "sauna": null, "dinner": 3, "breakfast": 2, "bonfire": 2, "revisit": "いいえ", "comment": ""}, {"date": "2025/08/11", "month": "2025-08", "age": null, "overall": 8, "staff": 10, "clean": 10, "sauna": 9, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": ""}, {"date": "2025/08/12", "month": "2025-08", "age": null, "overall": 9, "staff": 10, "clean": 10, "sauna": 8, "dinner": 9, "breakfast": 10, "bonfire": 9, "revisit": "はい", "comment": "ドーム型テントでのグランピング、とても楽しかったです。\n\n広さもあって明るし、外の景色も見えるし開放感も良かったです。ベッドの寝心地もgoodでした。\nお隣の建物でも雨でもバーベキューできるし、シャワー、トイレが個別なのはなによりうれしいポイントです。\n\n改善点を挙げさせていただければ、食事時のお皿やコップの数が少なく感じました。\nもちろん洗えば良いのですが、取り皿としてもう少し余分に欲しかったです。\n朝のヨーグルトにスプーンがなくて、キッチンの余っていたティースプーンで廻し食べしました。。\nぜひ改善を期待しています。\n\n今回はすさまじい暴風雨で、楽しみにしていた眼の前富士山が見えなかったのは、本当に残念でしたが、TOTONOIさんのグランピングはとても良かったです！\nお世話になりました。"}, {"date": "2025/08/12", "month": "2025-08", "age": null, "overall": 7, "staff": 9, "clean": 8, "sauna": null, "dinner": 6, "breakfast": 5, "bonfire": null, "revisit": "わからない", "comment": ""}, {"date": "2025/08/13", "month": "2025-08", "age": null, "overall": 9, "staff": 10, "clean": 9, "sauna": 9, "dinner": 9, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": "お世話になりありがとうございました。天候はあいにくで富士山は拝めませんでしたが、またの機会の楽しみとしたいと思います。"}, {"date": "2025/08/14", "month": "2025-08", "age": null, "overall": 9, "staff": 10, "clean": 8, "sauna": null, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": "ペットシートの替えが少なくて足りなくなってしまったので、もう少しあると嬉しかったです"}, {"date": "2025/08/17", "month": "2025-08", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": null, "dinner": 10, "breakfast": 10, "bonfire": null, "revisit": "はい", "comment": "たのしかったです。また来年も来ます！"}, {"date": "2025/08/17", "month": "2025-08", "age": null, "overall": 10, "staff": 10, "clean": 8, "sauna": 8, "dinner": 7, "breakfast": 9, "bonfire": null, "revisit": "はい", "comment": "⚫︎連泊の時の2日目の夕飯をもう少し変えてほしい。とても美味しくいただきましたが、2日目は和食など違うものが食べたかったです。\n⚫︎サウナのボディーソープが体にしみました。（シャワー室のものとは別ものでしたか…？）\n⚫︎部屋に足ふきタオルが欲しかった。（雨天時は特に）食事の配膳の方も、部屋の中まで運んでくださる時に足元が濡れたまま入られていたので。\n⚫︎ハンモックが壊れていたので新調してほしい。\n全体的には、とても良く、また利用したいですし周りにもオススメしたい施設でした！\nありがとうございました！！！"}, {"date": "2025/08/21", "month": "2025-08", "age": null, "overall": 9, "staff": 10, "clean": 9, "sauna": null, "dinner": 10, "breakfast": 8, "bonfire": 9, "revisit": "はい", "comment": "施設の方がとても優しく親切でした。\n子どもたちのわがままにも、臨機応変に対応して下さり大喜びでした。\n初めてのグランピングでしたが、また是非利用したいと思います！\n本当にありがとうございました！\n\n強いて言うならば、ダイニングは匂いがこもるので、大きな窓に網戸があると換気ができて、より良かったなと思います。\nそれでもやっぱり、室内で天候や虫など気にせずBBQを楽しめるのは、とても魅力的でした！"}, {"date": "2025/08/22", "month": "2025-08", "age": null, "overall": 9, "staff": 9, "clean": 9, "sauna": null, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": ""}, {"date": "2025/08/23", "month": "2025-08", "age": null, "overall": 9, "staff": 7, "clean": 7, "sauna": 10, "dinner": null, "breakfast": null, "bonfire": 2, "revisit": "はい", "comment": "ウェルカムドリンクは常にある方がいい。種類も最低でも5はある方がいいと思います。今の感じならホームページに打ち出さない方が良いかと思いました。期待を裏切られた感があります！\n一棟一棟の囲いも背の高いものに変えてプライベート感があるとより良いなぁと思いました。\nその他は素敵です！"}, {"date": "2025/08/23", "month": "2025-08", "age": null, "overall": 10, "staff": 10, "clean": 9, "sauna": null, "dinner": 8, "breakfast": 7, "bonfire": null, "revisit": "はい", "comment": ""}, {"date": "2025/08/24", "month": "2025-08", "age": null, "overall": 10, "staff": 10, "clean": 8, "sauna": 10, "dinner": 9, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": ""}, {"date": "2025/08/24", "month": "2025-08", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": null, "breakfast": null, "bonfire": 10, "revisit": "はい", "comment": ""}, {"date": "2025/08/25", "month": "2025-08", "age": null, "overall": 10, "staff": 10, "clean": 8, "sauna": 9, "dinner": 10, "breakfast": 10, "bonfire": 10, "revisit": "はい", "comment": ""}, {"date": "2025/08/25", "month": "2025-08", "age": null, "overall": 8, "staff": 8, "clean": 9, "sauna": 6, "dinner": 10, "breakfast": 5, "bonfire": 5, "revisit": "はい", "comment": "部屋に洋服をかけるスペースとハンガーを用意してほしい。\nお風呂の隣の奥の物置を物置として使わずカスタマーの収納スペースとして使った方が良いと思う。\n部屋にインターホンをつけてほしい。ノックだと気づかない時があり、申し訳なかった。\n楽しくすごせました。ありがとうございます。"}, {"date": "2025/08/26", "month": "2025-08", "age": null, "overall": 9, "staff": 9, "clean": 8, "sauna": 9, "dinner": 9, "breakfast": 9, "bonfire": 8, "revisit": "はい", "comment": ""}, {"date": "2025/08/30", "month": "2025-08", "age": null, "overall": 9, "staff": 10, "clean": 9, "sauna": null, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": ""}, {"date": "2025/08/30", "month": "2025-08", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": 10, "breakfast": 10, "bonfire": null, "revisit": "はい", "comment": ""}, {"date": "2025/08/31", "month": "2025-08", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": null, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": ""}, {"date": "2025/09/01", "month": "2025-09", "age": null, "overall": 8, "staff": 9, "clean": 9, "sauna": null, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": ""}, {"date": "2025/09/04", "month": "2025-09", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": ""}, {"date": "2025/09/06", "month": "2025-09", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": null, "dinner": 10, "breakfast": 10, "bonfire": 10, "revisit": "はい", "comment": "今回、彼女の誕生日旅行で利用させてもらいました。サプライズの準備から当日のスケジュールまでスタッフの方が親身に相談に乗っていただき、無事成功させることができました。本当にありがとうございました。また、食事も全て美味しくて、ロケーション、施設も完璧で人生で初めてのグランピングがこの施設でよかったと思いました。必ずまた利用します！"}, {"date": "2025/09/08", "month": "2025-09", "age": null, "overall": 9, "staff": 10, "clean": 9, "sauna": 10, "dinner": 9, "breakfast": 8, "bonfire": null, "revisit": "はい", "comment": "原因不明の窓の曇りは残念でしたー。\n☀️最高な朝だっただけに..."}, {"date": "2025/09/08", "month": "2025-09", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": null, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": "とても充実した2日感を過ごせました！！\n部屋にジェンガや、トランプがあったり、バドミントンが借りれたり🏸\n食事も室内でできるので、暑さや虫も気になりませんでした！！\n\nお名前はわからないのですが、女性とスタッフの方にはとても良くしていただきました。\nおすすめの場所を教えてくださったり、たくさんお話ししてくださったり♪\nおかげでとても楽しい時間になりました！！\nオススメの花の都公園とても素敵でした🌼\n\nまた機会があれば伺いたいです。\n2日間ありがとうございました！"}, {"date": "2025/09/09", "month": "2025-09", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": "先日はありがとうございました。\n説明やサウナ利用など丁寧に案内していただき非常に快適でした。"}, {"date": "2025/09/10", "month": "2025-09", "age": null, "overall": 7, "staff": 9, "clean": 9, "sauna": 6, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "わからない", "comment": "食材持ち込みの場合、フライパンや塩胡椒、サランラップなどの有無がホームページに書かれていると助かります(買って行ってしまいました)"}, {"date": "2025/09/10", "month": "2025-09", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": null, "dinner": 10, "breakfast": 10, "bonfire": null, "revisit": "はい", "comment": ""}, {"date": "2025/09/12", "month": "2025-09", "age": null, "overall": 8, "staff": 10, "clean": 10, "sauna": 10, "dinner": 8, "breakfast": 8, "bonfire": null, "revisit": "はい", "comment": "プライベートサウナが、最高でした。清潔感の高い、各設備も、素晴らしいです。"}, {"date": "2025/09/13", "month": "2025-09", "age": null, "overall": 7, "staff": 10, "clean": 10, "sauna": null, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "わからない", "comment": "良かった点　犬連れだったのでプライベート感がありのんびりできた。\n改善してほしい点\n大型犬もOKならそれなりの食器を用意して欲しいです。（水飲みも）\n洗面所にタオル掛けがあるといいかなぁ。と思いました。\n懐中電灯の貸し出しがあると嬉しいです。"}, {"date": "2025/09/13", "month": "2025-09", "age": null, "overall": 7, "staff": 8, "clean": 9, "sauna": 9, "dinner": 7, "breakfast": 8, "bonfire": null, "revisit": "はい", "comment": ""}, {"date": "2025/09/13", "month": "2025-09", "age": null, "overall": 7, "staff": 10, "clean": 10, "sauna": null, "dinner": 7, "breakfast": 9, "bonfire": 10, "revisit": "はい", "comment": "犬同伴できる部屋は犬用のタオルを置いてほしいです。"}, {"date": "2025/09/15", "month": "2025-09", "age": null, "overall": 7, "staff": 7, "clean": 9, "sauna": 9, "dinner": null, "breakfast": null, "bonfire": 7, "revisit": "いいえ", "comment": ""}, {"date": "2025/09/15", "month": "2025-09", "age": null, "overall": 7, "staff": 10, "clean": 10, "sauna": 8, "dinner": 10, "breakfast": 10, "bonfire": 10, "revisit": "はい", "comment": "サウナは体験としてすごく良かったが、外気浴用の椅子が少し汗臭かった。\nスタッフの対応はLINEでかなりスムーズ、時間外対応にも寛容でストレスはなかった。\nキャンプサイト周りの下草管理が微妙に行き届いていないので気になる。\nコテージ内でのグリル使用は楽しかったが、排煙が間に合っておらず、全身燻されてしまった。\nアクティビティがもう少しあれば楽しい。"}, {"date": "2025/09/16", "month": "2025-09", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": 6, "breakfast": 10, "bonfire": null, "revisit": "はい", "comment": "夕食がとても豪華で大満足でしたが、全体的に味付けがとても濃かったです。塩味が強めでした。量も大変多く、内容も豪華で感動しました！"}, {"date": "2025/09/20", "month": "2025-09", "age": null, "overall": 5, "staff": 7, "clean": 9, "sauna": null, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "わからない", "comment": ""}, {"date": "2025/09/22", "month": "2025-09", "age": null, "overall": 9, "staff": 10, "clean": 10, "sauna": 10, "dinner": 10, "breakfast": 10, "bonfire": 8, "revisit": "はい", "comment": "夕食はとても美味しかったのですが、胃もたれしてしまうのでもう少しヘルシーな種類が選べるとありがたいです。肉1種類に魚2種類とかで嬉しいです。ミネストローネの人参とじゃがいもはかなり硬かったです。川魚は焼き加減が難しく、ベストの状態の写真とかあるともっと美味しく食べられたなと思いました。サウナの内鍵の金具部分がめちゃくちゃ熱かったので、何か巻いてもらえると助かります。\n焚き火体験が無料でマシュマロ焼けたので手軽で楽しかったです。\n施設内だけでかなり充実できる内容だったので、次回はもう少し早めにチェックインしたいと思います。\nありがとうございました！"}, {"date": "2025/09/22", "month": "2025-09", "age": null, "overall": 10, "staff": 10, "clean": 9, "sauna": 7, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": ""}, {"date": "2025/09/23", "month": "2025-09", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 8, "dinner": 10, "breakfast": 7, "bonfire": 7, "revisit": "はい", "comment": ""}, {"date": "2025/09/24", "month": "2025-09", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": null, "dinner": null, "breakfast": null, "bonfire": 7, "revisit": "はい", "comment": "スタッフさんの対応がとても良く、建物や設備も綺麗で充実した日を過ごすことが出来ました。また、スタッフさんとのやり取りがLINEという初めての経験でしたが電話よりも連絡が取りやすく、返信も早かった為とても良かった。焚き火の薪をサービスで貰ったので使ってみたが、普段は出来ない体験をすることが出来て癒された。今回グランピングを初めてしましたが、初めての場所がここで良かったと思いました。ありがとうございました！"}, {"date": "2025/09/24", "month": "2025-09", "age": null, "overall": 8, "staff": 10, "clean": 10, "sauna": null, "dinner": 7, "breakfast": 7, "bonfire": 10, "revisit": "わからない", "comment": ""}, {"date": "2025/09/24", "month": "2025-09", "age": null, "overall": 10, "staff": 10, "clean": 9, "sauna": 9, "dinner": 10, "breakfast": 10, "bonfire": 10, "revisit": "はい", "comment": "部屋のクモの巣とサウナの扉以外はどれをとっても最高の満足度でした！ありがとうございました＼(^^)／"}, {"date": "2025/09/24", "month": "2025-09", "age": null, "overall": 9, "staff": 10, "clean": 10, "sauna": null, "dinner": null, "breakfast": null, "bonfire": 10, "revisit": "はい", "comment": "5,6台目の簡易ベットが固かった。そのほかは満足でした。"}, {"date": "2025/09/26", "month": "2025-09", "age": null, "overall": 10, "staff": 10, "clean": 9, "sauna": 10, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": "紙のお皿がもっとあったらよかった"}, {"date": "2025/09/27", "month": "2025-09", "age": null, "overall": 10, "staff": 10, "clean": 9, "sauna": null, "dinner": 4, "breakfast": 4, "bonfire": 10, "revisit": "はい", "comment": ""}, {"date": "2025/09/27", "month": "2025-09", "age": null, "overall": 7, "staff": 9, "clean": 8, "sauna": 9, "dinner": 9, "breakfast": 7, "bonfire": null, "revisit": "はい", "comment": "自然を実感でき、ご飯も美味しく満足です！"}, {"date": "2025/09/29", "month": "2025-09", "age": null, "overall": 10, "staff": 10, "clean": 9, "sauna": null, "dinner": 8, "breakfast": 9, "bonfire": 8, "revisit": "はい", "comment": "お米が欲しかった〜"}, {"date": "2025/09/29", "month": "2025-09", "age": null, "overall": 6, "staff": 6, "clean": 7, "sauna": null, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": "環境がとても良いのですが、これで温泉があるなど、少しゆったり出来る併設した施設があると良いですね。サウナを使わない人でも癒される環境。それと食事の充実、バリエーションがあると良いですね。\n愛犬のウェルカムボードは心遣いのアイデアだと思いました。例えば、宿泊者の愛犬を記念撮影して、次回再び宿泊に来た人にフォトフレーム付きの愛犬写真をウェルカムボードと一緒に並べて、フォトフレームをプレゼントすると喜ばれると思います。\nまた伺える日を楽しみにしております。"}, {"date": "2025/10/01", "month": "2025-10", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": null, "breakfast": 8, "bonfire": 5, "revisit": "はい", "comment": ""}, {"date": "2025/10/01", "month": "2025-10", "age": null, "overall": 8, "staff": 10, "clean": 8, "sauna": null, "dinner": null, "breakfast": null, "bonfire": 10, "revisit": "はい", "comment": ""}, {"date": "2025/10/01", "month": "2025-10", "age": null, "overall": 8, "staff": 9, "clean": 8, "sauna": 8, "dinner": 8, "breakfast": 7, "bonfire": null, "revisit": "はい", "comment": ""}, {"date": "2025/10/02", "month": "2025-10", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": null, "dinner": 10, "breakfast": 10, "bonfire": 10, "revisit": "はい", "comment": ""}, {"date": "2025/10/04", "month": "2025-10", "age": null, "overall": 10, "staff": 10, "clean": 8, "sauna": 9, "dinner": 8, "breakfast": 8, "bonfire": 10, "revisit": "はい", "comment": "綿棒があれば尚よかった"}, {"date": "2025/10/06", "month": "2025-10", "age": null, "overall": 6, "staff": 9, "clean": 8, "sauna": null, "dinner": 8, "breakfast": 6, "bonfire": 7, "revisit": "わからない", "comment": "富士山ビューが一番なこだわりだったので仕方のないことですが、天気が悪く富士山が全く見えなくて残念でした。"}, {"date": "2025/10/06", "month": "2025-10", "age": null, "overall": 9, "staff": 9, "clean": 10, "sauna": 10, "dinner": 9, "breakfast": 8, "bonfire": 8, "revisit": "はい", "comment": ""}, {"date": "2025/10/09", "month": "2025-10", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 6, "dinner": null, "breakfast": null, "bonfire": 6, "revisit": "はい", "comment": ""}, {"date": "2025/10/12", "month": "2025-10", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": null, "dinner": 10, "breakfast": 10, "bonfire": 10, "revisit": "はい", "comment": "全体を通して非常に満足出来ました。\n環境、料理、スタッフの対応全て良かったです。\nとても素敵な週末になりました。\n\n改善頂きたい点について、強いてあげるとしたら以下の通りです。\n\n①夜トイレに行く際に足元が暗すぎるので、小さいもので構いませんので灯りがあると助かります。\n\n②ドームテントテントが建てられているバルコニーに上がる際の階段が頼りないので、もう少し安定したものだと嬉しいです。\n\n③今回、私は車椅子で利用させていただきました。少数派なのは理解しておりますが、バルコニーの登り降りの際に利用できるスロープがあると非常に助かります。"}, {"date": "2025/10/12", "month": "2025-10", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 6, "dinner": 7, "breakfast": 4, "bonfire": 5, "revisit": "はい", "comment": "スタッフさんがとても丁寧でした。朝早くから夜遅くまでありがとうございました。\nそちらは私の住んでいる地域と違いこれから格段と冷えてくると思います。\nお身体に気をつけてください。\n素敵なひと時をありがとうございました。\nまた利用します。"}, {"date": "2025/10/12", "month": "2025-10", "age": null, "overall": 9, "staff": 9, "clean": 8, "sauna": null, "dinner": null, "breakfast": 9, "bonfire": 9, "revisit": "はい", "comment": "網戸が破れていると連絡したらすぐに対応してくれてよかったです。改善点としては、雨の音が屋根から室外機に落ちて大きな音が聞こえて気になりました。楽しい旅行ができました。ありがとうございました。"}, {"date": "2025/10/18", "month": "2025-10", "age": null, "overall": 8, "staff": 10, "clean": 10, "sauna": 10, "dinner": 10, "breakfast": 10, "bonfire": 10, "revisit": "はい", "comment": "誕生日サプライズさせて頂きましたが、LINEで逐一作戦を立てさせて頂き、非常にありがたかったです！"}, {"date": "2025/10/19", "month": "2025-10", "age": null, "overall": 10, "staff": 10, "clean": 7, "sauna": null, "dinner": 10, "breakfast": 10, "bonfire": 10, "revisit": "はい", "comment": "接客、サービスが素晴らしく、また利用したいと思いました。"}, {"date": "2025/10/19", "month": "2025-10", "age": null, "overall": 9, "staff": 9, "clean": 9, "sauna": null, "dinner": null, "breakfast": null, "bonfire": 9, "revisit": "はい", "comment": ""}, {"date": "2025/10/19", "month": "2025-10", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": null, "dinner": null, "breakfast": null, "bonfire": 10, "revisit": "はい", "comment": ""}, {"date": "2025/10/20", "month": "2025-10", "age": null, "overall": 10, "staff": 9, "clean": 6, "sauna": 8, "dinner": null, "breakfast": null, "bonfire": 7, "revisit": "はい", "comment": "・グリルは焼くものにもよると思いますが、鉄板の方が焼きやすいかな〜と個人的に思いました。キッチンは油、菜箸、ピーラーなどが欲しいな〜、と思いました。(食料を持参するだったので野菜丸々買っちゃって、、)\n・サウナの外にも小さいものでもいいので時計があれば中まで時間を見に行くことなく入れたかな〜と思います！\n\nスタッフの方の対応もよく、快適に過ごさせて頂きました！🙂‍↕️💞\n私が行った日は雨が降っていたので、次は快晴になる事を祈ってまた利用させてもらいたいと思います！ありがとうございました〜！✨💞"}, {"date": "2025/10/25", "month": "2025-10", "age": null, "overall": 9, "staff": 9, "clean": 9, "sauna": null, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": "バーベキューコンロがよかった。雨が降っていたので、食事どころの入り口とテントの入口が近いとありがたかったと思いました。"}, {"date": "2025/10/25", "month": "2025-10", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": null, "breakfast": 10, "bonfire": null, "revisit": "はい", "comment": ""}, {"date": "2025/10/25", "month": "2025-10", "age": null, "overall": 8, "staff": 8, "clean": 8, "sauna": 10, "dinner": null, "breakfast": null, "bonfire": 6, "revisit": "はい", "comment": "雨でも焚き火ができたら非常に良かったです\nその他には不満に感じたことはありませんでした\nぜひまた利用したいです\nありがとうございました"}, {"date": "2025/10/25", "month": "2025-10", "age": null, "overall": 8, "staff": 10, "clean": 8, "sauna": null, "dinner": null, "breakfast": 8, "bonfire": 8, "revisit": "はい", "comment": "小型犬用のサークルまたはケージの貸し出しがあるといいなと思いました。それ以外は良かったです。またお世話になりたいと思います。"}, {"date": "2025/10/28", "month": "2025-10", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": null, "breakfast": null, "bonfire": 10, "revisit": "はい", "comment": "この度はありがとうございました。\nめちゃくちゃ良くて感動しました。\n\n\n焚き火、施設の綺麗さ、サウナ等良い点は数多いため省かせて頂きます。\n\n\nご要望としては、7時半〜9時の後に 9時半〜11時の枠のサウナが利用ができると更に嬉しいです。\n夜の時間帯のため、静かにしなければいけないルール等を付ければ、他のお客様に対しても迷惑をかけずに稼働できるかなと思いました。\n\n\nまたサウナが最高だった故、1時間半では物足りないと思いましたので、2枠連続で予約した場合連続で使える等もあると良いなと思いました。\n\nこの度はありがとうございました。"}, {"date": "2025/10/28", "month": "2025-10", "age": null, "overall": 9, "staff": 10, "clean": 10, "sauna": 10, "dinner": null, "breakfast": null, "bonfire": 10, "revisit": "はい", "comment": ""}, {"date": "2025/10/29", "month": "2025-10", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 8, "dinner": 10, "breakfast": 10, "bonfire": null, "revisit": "はい", "comment": ""}, {"date": "2025/10/30", "month": "2025-10", "age": null, "overall": 8, "staff": 10, "clean": 9, "sauna": 9, "dinner": 9, "breakfast": 9, "bonfire": 9, "revisit": "はい", "comment": ""}, {"date": "2025/10/31", "month": "2025-10", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 8, "dinner": 10, "breakfast": 10, "bonfire": 10, "revisit": "はい", "comment": "彼の誕生日に利用させていただきました。\n何から何までお心遣いがとても嬉しかったです。\nまた利用したいです。ありがとうございました！"}, {"date": "2025/10/31", "month": "2025-10", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": 10, "breakfast": 10, "bonfire": 10, "revisit": "はい", "comment": ""}, {"date": "2025/10/31", "month": "2025-10", "age": null, "overall": 5, "staff": 7, "clean": 7, "sauna": null, "dinner": null, "breakfast": null, "bonfire": 6, "revisit": "はい", "comment": ""}, {"date": "2025/11/01", "month": "2025-11", "age": null, "overall": 8, "staff": 10, "clean": 9, "sauna": 7, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": "スタッフの方々の対応があたたかくて、良い時間を過ごすことができました。ありがとうございました。"}, {"date": "2025/11/03", "month": "2025-11", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": null, "breakfast": null, "bonfire": 10, "revisit": "はい", "comment": ""}, {"date": "2025/11/03", "month": "2025-11", "age": null, "overall": 8, "staff": 10, "clean": 9, "sauna": null, "dinner": 10, "breakfast": 9, "bonfire": 9, "revisit": "はい", "comment": "良かった点\n食事が良かったです。夕食のBBQは肉は質が良くとても美味しかったですし、魚の串焼き(蒸し)なや馬刺しはなかなか食べる機会が無いので、趣向的にも味的にも良かったです。朝食のタコス風なのも、夕食同様楽しみながら美味しく食べられました。\n改善して欲しい点\n食事時に、取り皿がもう少し欲しかったです。洗い物的に難しいなら紙皿でも良いので欲しかったです。朝食にヨーグルトor果物が欲しかったです。\nハンモックを楽しみにしていたのですが、濡れていて使う事が出来なくて残念でした。\n懐中電灯があれば便利でした(携帯のライトを使えば良いという考えだったのかな？)\nハンガーが少なかったです。\n\n全体的な感想\n上記の選択でも高くつけさせていただいた通り、とても楽しく過ごさせていただきました。どうもありがとうございました。"}, {"date": "2025/11/04", "month": "2025-11", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": 10, "breakfast": 7, "bonfire": null, "revisit": "はい", "comment": "朝食は手がかからない、サンドイッチ等の方が嬉しかったかもしれません。"}, {"date": "2025/11/04", "month": "2025-11", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": 10, "breakfast": 10, "bonfire": 10, "revisit": "はい", "comment": ""}, {"date": "2025/11/04", "month": "2025-11", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": 7, "breakfast": 5, "bonfire": null, "revisit": "はい", "comment": ""}, {"date": "2025/11/06", "month": "2025-11", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 5, "dinner": 10, "breakfast": 10, "bonfire": 10, "revisit": "はい", "comment": ""}, {"date": "2025/11/11", "month": "2025-11", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": ""}, {"date": "2025/11/11", "month": "2025-11", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": 10, "breakfast": 10, "bonfire": null, "revisit": "はい", "comment": "全てよかったです"}, {"date": "2025/11/11", "month": "2025-11", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": null, "dinner": 10, "breakfast": 10, "bonfire": 10, "revisit": "いいえ", "comment": ""}, {"date": "2025/11/12", "month": "2025-11", "age": null, "overall": 8, "staff": 10, "clean": 8, "sauna": null, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": "よかった点は、テレビがない代わりにボードゲームがあったところ！ジェンガですごく盛り上がりました！\nただ季節の関係もあるかとは思いますが、食事をとったりシャワールームがあるお部屋が結構寒くて、凍えてました、、もう少し暖かくなるともっとよかったです！\nでも初めてのグランピングがここの施設で良かったです😌ありがとうございました！"}, {"date": "2025/11/15", "month": "2025-11", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 8, "dinner": null, "breakfast": null, "bonfire": 10, "revisit": "はい", "comment": ""}, {"date": "2025/11/15", "month": "2025-11", "age": null, "overall": 7, "staff": 10, "clean": 7, "sauna": null, "dinner": null, "breakfast": null, "bonfire": 10, "revisit": "はい", "comment": "浴室だけが非常に残念でした。天井、壁上の窓上の縁、シャワーヘッド、浴槽側と反対側の壁下、カビだらけです。日頃から掃除をしていない事が丸分かりでした。本当に非常に残念です。"}, {"date": "2025/11/16", "month": "2025-11", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": null, "breakfast": null, "bonfire": 10, "revisit": "はい", "comment": "テーブルゲーム、延長コードがあるのがよかったです"}, {"date": "2025/11/17", "month": "2025-11", "age": null, "overall": 9, "staff": 10, "clean": 9, "sauna": 9, "dinner": 8, "breakfast": 8, "bonfire": 10, "revisit": "はい", "comment": "急な要望にもすぐに応えていただき、快適な滞在になりました。スタッフの方がとても親切で、クマが少し不安でしたが、安心して楽しめました。\n欲を言えば、ドームにも小さくて構わないので冷蔵庫があると、予備の食器があると良かったです。\nありがとうございました。"}, {"date": "2025/11/17", "month": "2025-11", "age": null, "overall": 9, "staff": 10, "clean": 10, "sauna": 10, "dinner": 8, "breakfast": 10, "bonfire": null, "revisit": "はい", "comment": "夜ご飯はお肉や馬刺しなどとても豪華で美味しかったです。ご飯があればもっとよかったです。素敵な体験をありがとうございます。"}, {"date": "2025/11/18", "month": "2025-11", "age": null, "overall": 9, "staff": 9, "clean": 10, "sauna": 10, "dinner": 8, "breakfast": 9, "bonfire": 9, "revisit": "はい", "comment": "サウナが最高でした。また、寒かったのでぬるま湯か水か選択できると良いと思いました(水風呂が広いので、温めるのに時間がかかった)\n\n料理ですが、男3名でも油物が多いと感じましたので、1品減らすぐらいが丁度良いと感じました。"}, {"date": "2025/11/18", "month": "2025-11", "age": null, "overall": 10, "staff": 10, "clean": 5, "sauna": null, "dinner": 8, "breakfast": 10, "bonfire": 10, "revisit": "はい", "comment": "お世話になっております。食堂の部屋にカメムシや天井に、クモの巣？がありました。\nまた、トイレのウォシュレットが故障をしていました。\n直した方がいいかと思います。よろしくお願いいたします。\nこの度はお世話になりました。"}, {"date": "2025/11/20", "month": "2025-11", "age": null, "overall": 8, "staff": 10, "clean": 6, "sauna": null, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": "お庭の草を刈って欲しかった。"}, {"date": "2025/11/23", "month": "2025-11", "age": null, "overall": 8, "staff": 10, "clean": 9, "sauna": 8, "dinner": 8, "breakfast": 8, "bonfire": 8, "revisit": "はい", "comment": "グリルの温度計が壊れていたのか、予熱温度になるまで待っていたが、温度計が上がらず、放置していたら室内が煙で充満してしまった！！\n確認とメンテナンスをお願いします。"}, {"date": "2025/11/23", "month": "2025-11", "age": null, "overall": 9, "staff": 10, "clean": 10, "sauna": 9, "dinner": 9, "breakfast": 10, "bonfire": 9, "revisit": "はい", "comment": "良かった点\n・ご飯のボリューム満点で、追加で食材を持って行きましたが必要ないぐらいでした。食べ盛りの息子たちも大満足で、ステーキは柔らかくて本当に美味しかったです。\n・ふたつ続きのドームテントは初めてでしたがとっても広くて、位置的にもプライベート感満載で富士山も見えて、とても良かったです。\n・プライベートサウナ楽しかったです。\n\n改善点\n・ドームテントの構造上、仕方ないかもしれませんが、ドームテントの出入口がご飯を食べる棟の窓の出入口から遠く、ぐるっとまわっていかないといけないのが不便でした。出入口が近いと便利だなと思います。\n・こちらも仕方ないかもしれないですが、サウナの水風呂の蓋にも水の中にも葉っぱ？がたくさん落ちていて、もう少し綺麗だと嬉しいです。\n・お伝えし忘れましたが、グリルの温度計が壊れているようで一向に温度が変わらなくて、気づいたら熱々になっていて煙がすごいことになっていました。一度確認いただいた方がいいかもしれないです。\n・鱒を焼こうとすると重い背中の方に串がくるっとまわってしまって上手く焼けなかったのが残念でした。\n・日が傾くとドームテントも食事棟もエアコンをつけても寒くて寒くて大変でした。灯油ストーブもつけましたが、使い方がいまいちわからなくて使い方の案内があると良かったです。もう少し暖を取れるものがあると嬉しいです。\n・HPにウェルカムドリンクとありましたが、なかったような？？\n\n気になったところを書かせていただきましたが、総じてとても良かったです！\n選んで良かったと思いました！\nスタッフのかたも優しく親切でした。\nまた機会があればお世話になりたいです。\nありがとうございました！"}, {"date": "2025/11/23", "month": "2025-11", "age": null, "overall": 8, "staff": 8, "clean": 8, "sauna": null, "dinner": 9, "breakfast": 8, "bonfire": null, "revisit": "はい", "comment": "テレビが普通に見れる方がいい、鍋コースにご飯がほしかった"}, {"date": "2025/11/24", "month": "2025-11", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": null, "dinner": 10, "breakfast": 10, "bonfire": 10, "revisit": "はい", "comment": ""}, {"date": "2025/11/24", "month": "2025-11", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 8, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": "とても楽しかったです。景色も最高でした♪ありがとうございました"}, {"date": "2025/11/25", "month": "2025-11", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": 10, "breakfast": 7, "bonfire": 10, "revisit": "はい", "comment": "本当に素敵な2日を過ごさせて頂きました☆子供達も大喜びで、家族で思いっきりのびのびといい時間を過ごせました(^^)また必ず泊まりに伺います！しゅんさん、色々と有難うございました！"}, {"date": "2025/11/26", "month": "2025-11", "age": null, "overall": 9, "staff": 10, "clean": 6, "sauna": null, "dinner": 9, "breakfast": 10, "bonfire": 2, "revisit": "はい", "comment": "良かった点：スタッフさんのサービスがとても良かったです！！ちょっとした疑問にも優しく答えてくださったり、チェックアウトのあとにブランコをさせていただいたり、とても嬉しかったです。\n改善してほしい点：食器のスプーンの洗い残し\nベッドシーツのシミ\n（これは難しいのかもしれないのですが、、）コンセントの位置🔌\n延長コードがあったのでとても良かったのですが、それでも長さが足りませんでした、、。\n乾燥するため、加湿器があると嬉しい、、。"}, {"date": "2025/11/28", "month": "2025-11", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 9, "dinner": 10, "breakfast": 10, "bonfire": 10, "revisit": "はい", "comment": "バースデーお祝いでケーキも利用させて貰いました！\nこちらの融通を利かせていただいて、ステキなケーキとっても嬉しかったです🙇‍♀️♡\n\nご飯もとっても美味しくて、今まで利用したグランピングの中で1番でした！！\nサウナもきれいで、プライベート空間が守られているのがとてもよかったです！\nあのタイプのサウナを利用するのが初めてで、ストーブから距離をとって利用はしていましたが、2人して熱さ若干火傷をしてしまったのが大変でしたが、とてもいい経験でした💦\n\n雨が降っていたけど、夜中は綺麗な星空が見えて、朝は富士山が大きく見えたのも嬉しかったです！\n\nスタッフの皆さんもとても優しくて、感謝しています。\nまた利用させていただきたいです！\nステキな経験をありがとうございました！"}, {"date": "2025/11/30", "month": "2025-11", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": 10, "breakfast": 10, "bonfire": null, "revisit": "はい", "comment": "誕生日サプライズに使わせて頂きました。ケーキも美味しくバルーンも素敵でした！ただバルーンのそばの小さいライトが消えかかってるものが多かったのが少し残念でした😢それ以外は大満足なのでまた利用させていただきます！"}, {"date": "2025/12/05", "month": "2025-12", "age": null, "overall": 6, "staff": 10, "clean": 9, "sauna": 10, "dinner": 10, "breakfast": 10, "bonfire": 10, "revisit": "はい", "comment": "サウナの着替えスペースに洋服掛けられるフックが有ると直置きにならなくて便利\n洗面所にタオルを掛けが有ると便利\nコーヒーの量が測れないので、コーヒーメジャーか測りが有ると便利"}, {"date": "2025/12/06", "month": "2025-12", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": null, "breakfast": null, "bonfire": 10, "revisit": "はい", "comment": "今年もありがとうございました"}, {"date": "2025/12/06", "month": "2025-12", "age": null, "overall": 10, "staff": 10, "clean": 8, "sauna": 9, "dinner": 10, "breakfast": 10, "bonfire": 10, "revisit": "はい", "comment": ""}, {"date": "2025/12/07", "month": "2025-12", "age": null, "overall": 9, "staff": 10, "clean": 8, "sauna": null, "dinner": null, "breakfast": null, "bonfire": 3, "revisit": "はい", "comment": "テント内を赤ちゃんが歩き回ったら靴下真っ黒になりました。赤ちゃんは床を這いずり回るので、水拭きして頂けると助かります。"}, {"date": "2025/12/07", "month": "2025-12", "age": null, "overall": 7, "staff": 6, "clean": 10, "sauna": 10, "dinner": 8, "breakfast": 8, "bonfire": 1, "revisit": "いいえ", "comment": ""}, {"date": "2025/12/08", "month": "2025-12", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": null, "dinner": 9, "breakfast": 10, "bonfire": 9, "revisit": "はい", "comment": "全体的にとても満足でしたが\n帰る時にお掃除される車だと思いますがチェックアウト少し前に車が入ってこられていたので少し気掛かりでした。"}, {"date": "2025/12/12", "month": "2025-12", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": 10, "breakfast": null, "bonfire": 10, "revisit": "はい", "comment": ""}, {"date": "2025/12/14", "month": "2025-12", "age": null, "overall": 10, "staff": 10, "clean": 8, "sauna": null, "dinner": null, "breakfast": null, "bonfire": 10, "revisit": "はい", "comment": "スタッフの方がとても感じ良く、素敵でした。\nお風呂の壁がもう少し綺麗だともっとよかったです。\nすてきな旅行になりました。ありがとうございました"}, {"date": "2025/12/14", "month": "2025-12", "age": null, "overall": 10, "staff": 10, "clean": 8, "sauna": null, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": "富士山も綺麗に見れてとても楽しかったです"}, {"date": "2025/12/15", "month": "2025-12", "age": null, "overall": 8, "staff": 8, "clean": 8, "sauna": 10, "dinner": 3, "breakfast": null, "bonfire": 10, "revisit": "はい", "comment": "焚き火を追加で購入したのですが結局雨で使えず無駄になってしまいました…\nそこのケアもお願いしたかったです"}, {"date": "2025/12/15", "month": "2025-12", "age": null, "overall": 8, "staff": 9, "clean": 10, "sauna": 9, "dinner": 10, "breakfast": 6, "bonfire": null, "revisit": "はい", "comment": ""}, {"date": "2025/12/19", "month": "2025-12", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": null, "dinner": 8, "breakfast": 7, "bonfire": null, "revisit": "はい", "comment": ""}, {"date": "2025/12/20", "month": "2025-12", "age": null, "overall": 7, "staff": 10, "clean": 10, "sauna": 10, "dinner": 10, "breakfast": null, "bonfire": 10, "revisit": "はい", "comment": "施設の設置自体なのですが、食事棟と寝る場所が移動するのが少し面倒だと感じました。\n食事は満足できるボリュームで全て美味しかったです。夜空と富士山の景色も本当に綺麗でした。また、サウナ自体もとても良い体験になりました。1日目からプロジェクター・焚き火等丁寧に対応していただきありがとうございました。また利用したいと思います。"}, {"date": "2025/12/21", "month": "2025-12", "age": null, "overall": 10, "staff": 10, "clean": 9, "sauna": null, "dinner": 10, "breakfast": 10, "bonfire": 10, "revisit": "はい", "comment": ""}, {"date": "2025/12/24", "month": "2025-12", "age": null, "overall": 10, "staff": 10, "clean": 9, "sauna": 10, "dinner": 10, "breakfast": 10, "bonfire": null, "revisit": "はい", "comment": "グランピングはもちろん、サウナやケーキなどのオプションもとても丁寧に対応して頂きありがとうございました。"}, {"date": "2025/12/25", "month": "2025-12", "age": null, "overall": 8, "staff": 10, "clean": 10, "sauna": 7, "dinner": 10, "breakfast": 10, "bonfire": 10, "revisit": "はい", "comment": "冬だと夜が真っ暗なので、道路からホテルに入る所に看板か灯があると良いかなと思いました。途中真っ暗すぎて怖かったです笑。真ん中でやる焚き火の時間がもう少し長い時間だと行こうと思えました。雨だったので水捌けが悪く大変だったけど、車を棟の目の前まで停めれるのはよかったです。サウナを利用しましたが、それぞれの部屋についているシャワールームのようにボックスになってる方が寒くなくてより快適に過ごせそうだと感じました。食事棟にも暖房があったので美味しい最高のご飯をゆっくり頂く方ができ、スタッフの方々も迅速な対応！分かりやすい説明だったのでよかったです！当日は富士山を拝めず悔しい気持ちでしたが、朝になり姿を見せてくれお部屋からも良い眺めでとってもいい朝でした◎快晴の日にまたリベンジに来ます！ありがとうございました。"}, {"date": "2025/12/27", "month": "2025-12", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": null, "dinner": null, "breakfast": null, "bonfire": 10, "revisit": "はい", "comment": ""}, {"date": "2025/12/28", "month": "2025-12", "age": null, "overall": 8, "staff": 10, "clean": 9, "sauna": null, "dinner": 7, "breakfast": 8, "bonfire": 10, "revisit": "はい", "comment": ""}, {"date": "2025/12/29", "month": "2025-12", "age": null, "overall": 10, "staff": 10, "clean": 10, "sauna": null, "dinner": 10, "breakfast": 10, "bonfire": null, "revisit": "はい", "comment": ""}, {"date": "2025/12/29", "month": "2025-12", "age": null, "overall": 9, "staff": 10, "clean": 9, "sauna": 10, "dinner": 7, "breakfast": 6, "bonfire": 10, "revisit": "はい", "comment": ""}, {"date": "2025/12/30", "month": "2025-12", "age": null, "overall": 5, "staff": 5, "clean": 5, "sauna": 5, "dinner": 5, "breakfast": 5, "bonfire": 5, "revisit": "はい", "comment": "テストです"}, {"date": "2025/12/30", "month": "2025-12", "age": null, "overall": 5, "staff": 5, "clean": 5, "sauna": 5, "dinner": 5, "breakfast": 5, "bonfire": 5, "revisit": "はい", "comment": "テスト2"}, {"date": "2025/12/30", "month": "2025-12", "age": null, "overall": 1, "staff": 1, "clean": 1, "sauna": 1, "dinner": 1, "breakfast": 1, "bonfire": 1, "revisit": "わからない", "comment": "テスト３"}, {"date": "2025/12/30", "month": "2025-12", "age": null, "overall": 1, "staff": 1, "clean": 1, "sauna": null, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": "テストです"}, {"date": "2025/12/30", "month": "2025-12", "age": null, "overall": 1, "staff": 1, "clean": 1, "sauna": null, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "わからない", "comment": "テスト2です"}, {"date": "2025/12/30", "month": "2025-12", "age": null, "overall": 1, "staff": 1, "clean": 1, "sauna": null, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": "test3です"}, {"date": "2025/12/31", "month": "2025-12", "age": "20代", "overall": 1, "staff": 1, "clean": 1, "sauna": null, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": "test5"}, {"date": "2025/12/31", "month": "2025-12", "age": "20代", "overall": 1, "staff": 2, "clean": 3, "sauna": 4, "dinner": 5, "breakfast": 6, "bonfire": 7, "revisit": "はい", "comment": "test6"}, {"date": "2026/01/02", "month": "2026-01", "age": "40代", "overall": 3, "staff": 10, "clean": 3, "sauna": 10, "dinner": 3, "breakfast": 3, "bonfire": 10, "revisit": "はい", "comment": "他のグランピング施設もよく利用するが、他の施設にはない良い点（景観やサウナ、焚き火サービス、遊具があるなど）もある一方で、残念なところ（駐車場が泥だらけで車が汚れる、脱衣所の換気扇が埃だらけ、各個室のお風呂に湯船がない、値段の割に食事の量が少ない、部屋に設置されている食器が少なすぎる、設置されているコーヒーの分量を測るものがない等）が多く、残念な気持ちになってしまった。全体的には子どもも気に入っているのでまた来たいが、改善いただけたらもっとよくなると思うので検討いただきたいです。"}, {"date": "2026/01/02", "month": "2026-01", "age": "30代", "overall": 9, "staff": 10, "clean": 10, "sauna": null, "dinner": 10, "breakfast": 10, "bonfire": null, "revisit": "はい", "comment": "フレンドリーで礼儀正しい従業員。☺️\nシャワーのお湯は最高です！！！🚿🥰\n魅惑的な景色に加えて、とても穏やかで本当にリラックスできる環境です。🗻👩‍❤️‍👨\n残念なのは？🤔\n駐車場！泥だらけで、新しいブーツが全部泥だらけになってしまった…😱😳"}, {"date": "2026/01/02", "month": "2026-01", "age": "40代", "overall": 7, "staff": 8, "clean": 8, "sauna": null, "dinner": 8, "breakfast": 8, "bonfire": 8, "revisit": "はい", "comment": ""}, {"date": "2026/01/03", "month": "2026-01", "age": "40代", "overall": 10, "staff": 10, "clean": 10, "sauna": 9, "dinner": 10, "breakfast": 9, "bonfire": 10, "revisit": "はい", "comment": "ドーム内はとても綺麗でした。寒くないか不安でしたが、とても暖かくて問題ありませんでした。\n食事は量がかなり多くて満足でした。\n朝食は分量が良く分からず、かなり残ってしまいましたが、とても美味しかったです！\n\nまた利用したいと思いました。ありがとうございました。"}, {"date": "2026/01/03", "month": "2026-01", "age": "30代", "overall": 2, "staff": 10, "clean": 10, "sauna": null, "dinner": 10, "breakfast": 10, "bonfire": null, "revisit": "はい", "comment": "今回初めてグランピングというものを体験させていただきました。施設もとても綺麗で、スタッフの方もご丁寧に対応してくださり感謝申し上げます。また、食事も美味しくいただくことができました。ありがとうございました。またぜひ伺わせていただきたいです。本当にありがとうございました！"}, {"date": "2026/01/05", "month": "2026-01", "age": "30代", "overall": 10, "staff": 10, "clean": 10, "sauna": null, "dinner": 10, "breakfast": 9, "bonfire": 10, "revisit": "はい", "comment": "全体的に素晴らしい景色と焚き火ができとても満足だったが、朝食の際にサラダがあったのですが、ドレッシングなどの物がなく食べられませんでした。"}, {"date": "2026/01/11", "month": "2026-01", "age": "40代", "overall": 4, "staff": 10, "clean": 10, "sauna": null, "dinner": null, "breakfast": null, "bonfire": 3, "revisit": "わからない", "comment": "初めてグランピングで利用した時も思ったのですが、食事を利用しないと食器はほぼないし、素泊まりするには色々足りなすぎると思いました。その後他のキャンプ的な貸切の所を経験すると、犬人間共に備品が不自由でキャンプの贅沢バージョンだとしても、そしたらお値段が高すぎると思いました。土足禁止とありますが、天候の悪い時などあの地面は無理があります。素敵な景色と素敵な宿ですが…残念です。"}, {"date": "2026/01/18", "month": "2026-01", "age": "20代", "overall": 5, "staff": 10, "clean": 5, "sauna": null, "dinner": null, "breakfast": null, "bonfire": 10, "revisit": "はい", "comment": ""}, {"date": "2026/01/19", "month": "2026-01", "age": "20代", "overall": 8, "staff": 10, "clean": 10, "sauna": null, "dinner": 9, "breakfast": 5, "bonfire": null, "revisit": "わからない", "comment": "スタッフの方の対応がとても良かったです！"}, {"date": "2026/01/19", "month": "2026-01", "age": "20代", "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": 8, "breakfast": 9, "bonfire": 10, "revisit": "", "comment": ""}, {"date": "2026/01/19", "month": "2026-01", "age": "20代", "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": 8, "breakfast": 8, "bonfire": 10, "revisit": "はい", "comment": "もう本当にとっても大満足でした！お部屋のハッピーバースデーの飾りもライトがとっても可愛かったし、お部屋自体も白基調で、とっても上品で素敵なお部屋でした。マシュマロやレモンティーのサービスも嬉しかったし、スタッフさんとお話できたのもよかったです。オススメしていただいた場所（富士急ハイランド）に今日行きました！個室サウナもすごく良かったし、部屋も清潔で快適でした。焚き火も最高でした。夜ご飯は、普段食べないものが食べられてとっても美味しくて大満足だったのですが、サーロインステーキはかなり油が多くて、好きな人は好きだと思うのですが、私達には少し重たかったです笑　お肉と一緒に食べられるサンチェとコチュジャンなどがあったら最後までくどくならずに食べられるかな、と思いました！でも総合的に、最高でした。また行きたいです！ありがとうございました！"}, {"date": "2026/01/21", "month": "2026-01", "age": "20代", "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": ""}, {"date": "2026/01/24", "month": "2026-01", "age": "20代", "overall": 10, "staff": 10, "clean": 10, "sauna": null, "dinner": 10, "breakfast": 8, "bonfire": 10, "revisit": "はい", "comment": "時期的に仕方ないと思いますが、食事棟の方の暖房の効きが少し悪かったのでもう少しあったかくして欲しいです。"}, {"date": "2026/01/25", "month": "2026-01", "age": "20代", "overall": 7, "staff": 9, "clean": 8, "sauna": 9, "dinner": 5, "breakfast": 7, "bonfire": 3, "revisit": "わからない", "comment": "サウナはとても良かった\nご飯を食べるスペースが室内にも関わらずあまりにも寒すぎた\n焚き火用の薪を事前に追加購入していたが特に案内はなく、使用していないのに1100円取られてしまってモヤモヤしている。"}, {"date": "2026/01/26", "month": "2026-01", "age": "20代", "overall": 10, "staff": 10, "clean": 10, "sauna": 8, "dinner": null, "breakfast": null, "bonfire": 10, "revisit": "はい", "comment": "スタッフの方が皆さん気さくに話してくださり、対応もとてもスムーズで、感謝ばかりでした！ありがとうございました🙇"}, {"date": "2026/01/26", "month": "2026-01", "age": "20代", "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": 10, "breakfast": 10, "bonfire": null, "revisit": "はい", "comment": "誕生日の装飾もかわいくて、ケーキもとても美味しくて可愛すぎました。サウナは山梨の冬気温というのもあり今までで1番最高でした。スタッフさんの対応が本当に良くて最高の1泊でした。本当にかけがえのない思い出になりました。これからもたくさんのお客さんに訪れて欲しいです。"}, {"date": "2026/01/27", "month": "2026-01", "age": "20代", "overall": 9, "staff": 10, "clean": 10, "sauna": 10, "dinner": 10, "breakfast": 10, "bonfire": 9, "revisit": "はい", "comment": "食事等のエアコンを31℃にしてたけどほぼ効いてないような感じで、ずっと寒かったです。"}, {"date": "2026/02/01", "month": "2026-02", "age": "20代", "overall": 7, "staff": 8, "clean": 5, "sauna": null, "dinner": null, "breakfast": null, "bonfire": 4, "revisit": "はい", "comment": ""}, {"date": "2026/02/03", "month": "2026-02", "age": "10代", "overall": 10, "staff": 10, "clean": 10, "sauna": null, "dinner": 9, "breakfast": 10, "bonfire": 10, "revisit": "はい", "comment": ""}, {"date": "2026/02/05", "month": "2026-02", "age": "20代", "overall": 9, "staff": 9, "clean": 9, "sauna": null, "dinner": null, "breakfast": null, "bonfire": 9, "revisit": "わからない", "comment": ""}, {"date": "2026/02/11", "month": "2026-02", "age": "20代", "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": ""}, {"date": "2026/02/13", "month": "2026-02", "age": "20代", "overall": 9, "staff": 10, "clean": 10, "sauna": null, "dinner": null, "breakfast": null, "bonfire": 10, "revisit": "はい", "comment": ""}, {"date": "2026/02/13", "month": "2026-02", "age": "10代", "overall": 7, "staff": 8, "clean": 10, "sauna": null, "dinner": 8, "breakfast": 8, "bonfire": 10, "revisit": "はい", "comment": "夜、洗面所のお湯が出なかった"}, {"date": "2026/02/14", "month": "2026-02", "age": "20代", "overall": 8, "staff": 10, "clean": 10, "sauna": 5, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": "サウナの不具合が残念でしたが、すぐ対応していただきとても楽しく過ごすことが出来ました。\n寒かったのでお湯を張っていただいてましたが、水風呂が良かったなと思いました。水風呂かお湯か予約の際に選ばせて貰えたらいいなと思いました。\n問い合わせの際の電話対応含めスタッフの方の対応がすごく良かったです。\nLINEでやり取り出来るのはすごく楽だなと思いました。\nまた利用させていただきます。ありがとうございました。"}, {"date": "2026/02/14", "month": "2026-02", "age": "20代", "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": null, "breakfast": null, "bonfire": 10, "revisit": "はい", "comment": ""}, {"date": "2026/02/15", "month": "2026-02", "age": "50代", "overall": 8, "staff": 10, "clean": 10, "sauna": null, "dinner": 10, "breakfast": null, "bonfire": 10, "revisit": "はい", "comment": "暖房が暑かったり寒かったりで、\n難しかった\nシャワーしかないので、寒くて入らなかった"}, {"date": "2026/02/15", "month": "2026-02", "age": "50代", "overall": 5, "staff": 2, "clean": 6, "sauna": null, "dinner": null, "breakfast": null, "bonfire": 4, "revisit": "いいえ", "comment": "富士山キレイ、水捌け最悪、駐車場から長靴\n犬泥まみれ、湯船なくてシャワー騙された\nビショビショ\n寿司ジェンガ箸ない！\n石があってフェンスが開かないカートの意味がない\n元栓閉めるの早すぎ\n何も出来ない、寒いだけ\nエクストラベットが病院の付き添いの人が\n寝るやつみたいだった\n便座はあったかくて腹痛の人に優しい"}, {"date": "2026/02/15", "month": "2026-02", "age": "20代", "overall": 10, "staff": 10, "clean": 10, "sauna": null, "dinner": 10, "breakfast": 10, "bonfire": 10, "revisit": "はい", "comment": ""}, {"date": "2026/02/18", "month": "2026-02", "age": "10代", "overall": 8, "staff": 9, "clean": 8, "sauna": 10, "dinner": 7, "breakfast": 6, "bonfire": 8, "revisit": "はい", "comment": "とても良いサービス受けられてこの値段はとても満足しました！また利用したいと思います！"}, {"date": "2026/02/18", "month": "2026-02", "age": "20代", "overall": 10, "staff": 10, "clean": 10, "sauna": null, "dinner": null, "breakfast": null, "bonfire": 10, "revisit": "はい", "comment": ""}, {"date": "2026/02/20", "month": "2026-02", "age": "20代", "overall": 7, "staff": 10, "clean": 8, "sauna": null, "dinner": null, "breakfast": null, "bonfire": 8, "revisit": "はい", "comment": "暖房の効きが全体に行き渡らなかった点は改善していただきたいです。\nまた、利用しに来ます。ありがとうございました。"}, {"date": "2026/02/20", "month": "2026-02", "age": "20代", "overall": 9, "staff": 10, "clean": 7, "sauna": null, "dinner": 7, "breakfast": 8, "bonfire": null, "revisit": "はい", "comment": "ドレッサーの棚が汚かった"}, {"date": "2026/02/20", "month": "2026-02", "age": "30代", "overall": 10, "staff": 10, "clean": 10, "sauna": 9, "dinner": 10, "breakfast": 10, "bonfire": null, "revisit": "はい", "comment": "とてもとても満足のいく時間を過ごさせていただきました。\nあえて改善していただけたらもっと良いのになと思える部分だけ言いますと、サウナの薪を自分で入れるのは良いのですが、中の灰がこぼれてしままた時のために灰を中に戻せるトング？のようなものがあると安心だと思います、灰がこぼれた時に火事にしてしまうのではと不安になりました。\nあとはぬかるみが改善されると最高の場所になると感じました。\nでも本当にワンちゃんとの時間も、家族との時間も、富士山の風景も最高でまた必ず利用させていただきたいと思いました。\n特に、うちの犬がお布団に粗相してしまったにも関わらず、クリーニング代の請求もせずに、とても親切に対応していただき、ありがとうございました。"}, {"date": "2026/02/23", "month": "2026-02", "age": "20代", "overall": 8, "staff": 9, "clean": 10, "sauna": 10, "dinner": null, "breakfast": null, "bonfire": 9, "revisit": "はい", "comment": ""}, {"date": "2026/02/24", "month": "2026-02", "age": "20代", "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": 9, "breakfast": 8, "bonfire": 7, "revisit": "はい", "comment": ""}, {"date": "2026/02/25", "month": "2026-02", "age": "20代", "overall": 9, "staff": 10, "clean": 9, "sauna": null, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": ""}, {"date": "2026/02/27", "month": "2026-02", "age": "10代", "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": null, "breakfast": null, "bonfire": null, "revisit": "はい", "comment": "とても楽しかったです。"}, {"date": "2026/02/27", "month": "2026-02", "age": "10代", "overall": 6, "staff": 7, "clean": 10, "sauna": null, "dinner": 7, "breakfast": 7, "bonfire": 6, "revisit": "わからない", "comment": ""}, {"date": "2026/03/01", "month": "2026-03", "age": "20代", "overall": 10, "staff": 10, "clean": 10, "sauna": null, "dinner": 10, "breakfast": 10, "bonfire": 10, "revisit": "はい", "comment": ""}, {"date": "2026/03/01", "month": "2026-03", "age": "40代", "overall": 4, "staff": 7, "clean": 5, "sauna": null, "dinner": null, "breakfast": null, "bonfire": 3, "revisit": "はい", "comment": "食事部屋と就寝部屋の入り口は離れていない方が良かったです。\nエアコンの位置が片方ベットそばでしたので、中央になるよう設置されているとよかったです。"}, {"date": "2026/03/01", "month": "2026-03", "age": "20代", "overall": 10, "staff": 10, "clean": 10, "sauna": 10, "dinner": 10, "breakfast": 10, "bonfire": null, "revisit": "はい", "comment": "清潔感があって設備も整っていてまた利用したいと思った。今回のサウナがハマるきっかけとなったのでとても嬉しいです。"}, {"date": "2026/03/01", "month": "2026-03", "age": "50代", "overall": 8, "staff": 9, "clean": 8, "sauna": 9, "dinner": 9, "breakfast": 9, "bonfire": 10, "revisit": "はい", "comment": "サウナと焚き火体験は満喫しました。\n食事も良かったです。\nただ、はじめて入った時の部屋の匂いだけは\n気になりました。テントの素材だとは思いますが、もっと換気ができると良いと思いました。"}, {"date": "2026/03/01", "month": "2026-03", "age": "20代", "overall": 9, "staff": 9, "clean": 10, "sauna": null, "dinner": null, "breakfast": null, "bonfire": 10, "revisit": "はい", "comment": ""}, {"date": "2026/03/02", "month": "2026-03", "age": "10代", "overall": 9, "staff": 10, "clean": 9, "sauna": 10, "dinner": 10, "breakfast": 10, "bonfire": null, "revisit": "はい", "comment": "椅子が壊れていた"}, {"date": "2026/03/04", "month": "2026-03", "age": "10代", "overall": 7, "staff": 9, "clean": 8, "sauna": null, "dinner": 10, "breakfast": 10, "bonfire": null, "revisit": "はい", "comment": "雪でできないこともたくさんありましたが、とでも楽しいグランピングになりました！富士山がよく見えて綺麗でした！自分たちはうるさかったけど、スタッフの皆さんが優しく接客してくださいました！部屋を汚くしてしまって申し訳ありません🙇‍♀️ありがとうございました！"}, {"date": "2026/03/04", "month": "2026-03", "age": "10代", "overall": 10, "staff": 8, "clean": 10, "sauna": null, "dinner": 10, "breakfast": null, "bonfire": 10, "revisit": "はい", "comment": ""}, {"date": "2026/03/05", "month": "2026-03", "age": "20代", "overall":
